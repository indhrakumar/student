<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen flex flex-col bg-neutral-700 items-center overflow-hidden overflow-y-scroll">
    <div
      class="sticky top-0 z-[99] bg-black/70 backdrop-blur-lg w-full flex flex-col items-center pt-[30px] justify-center">
      <div
        class="mt-5 w-fit bg-sky-200 rounded-2xl h-[45%] p-3 mb-10 shadow-[0_0_15px_cyan]">
        <h2 class="text-center uppercase font-semibold text-2xl">
          Student Management
        </h2>
        <div class="flex flex-col lg:flex-row justify-center gap-4 mt-5">
          <input
            type="text"
            id="name"
            placeholder="Name"
            class="outline-none border border-purple-600 px-2 py-1 text-sm rounded-full" />
          <input
            type="text"
            id="reg"
            placeholder="Reg No"
            class="outline-none border border-purple-600 px-2 py-1 text-sm rounded-full" />
          <input
            type="text"
            id="dept"
            placeholder="Department"
            class="outline-none border border-purple-600 px-2 py-1 text-sm rounded-full" />
        </div>
        <button
          type="button"
          onclick="add()"
          class="flex mt-5 w-22 bg-sky-500 mx-auto justify-center rounded-2xl px-8 py-1 text-white font-bold capitalize tracking-wider">
          Add student
        </button>
      </div>
      <div>
        <input
          type="search"
          id="search"
          onkeyup="searchData()"
          class="mb-6 w-96 px-3 py-1 rounded-full outline-none shadow-[0_0_5px_white]"
          placeholder="Search" />
      </div>
    </div>
    <div
      class="grid grid-cols-1 md:grid-cols-3 gap-1 w-[100%] bg-neutral-500 pb-3 px-4"
      id="content"></div>

    <script>
      let editItem = null;
      function add() {
        let name = document.getElementById("name").value;
        let reg = document.getElementById("reg").value;
        let dept = document.getElementById("dept").value;
        if (name === "" || reg === "" || dept === "") {
          return;
        }
        let students = JSON.parse(localStorage.getItem("cls")) || [];
        let details = { name: name, reg: reg, dept: dept };
        if (editItem !== null) {
          students[editItem] = details;
          editItem = null;
        } else {
          students.push(details);
        }

        localStorage.setItem("cls", JSON.stringify(students));
        document.getElementById("name").value = "";
        document.getElementById("reg").value = "";
        document.getElementById("dept").value = "";
        show();
      }
      show();
      function Data(students) {
        let b = document.getElementById("content");
        b.innerHTML = "";

        students.forEach((student, index) => {
          let div = document.createElement("div");
          div.className =
            "flex flex-col bg-indigo-100 text-xs w-100 md:text-sm mx-2 mt-3 rounded-xl overflow-hidden shadow-[0_0_15px_black]";

          div.innerHTML = `
      <h2 class="h-6 flex justify-center items-center text-sm font-semibold tracking-widest uppercase bg-black text-cyan-300">student - ${index + 1}</h2>
      <div class="w-full tracking-wider flex mb-3">
        <p class="w-10 h-8 md:h-7 my-auto ms-3 me-3 flex items-center font-bold justify-center bg-cyan-300 rounded-full">
        ${index + 1}
        </p>
        <div class="flex flex-col mt-2 ms-2 me-5 w-2/3">
          <p>Name : <span class="uppercase text-md">${student.name}</span></p>
          <p>Reg No : <span class="uppercase"> ${student.reg}</span></p>
          <p>Department : <span class="uppercase"> ${student.dept}</span></p>
        </div>
        <div class="flex gap-3 lg:flex-col lg:justify-center lg:items-center items-center justify-center w-1/3 pt-4 ">
          <button type="button" onclick="edit(${index})" class="w-full h-8 ms-2 lg:ms-0 px-4 py-1 font-semibold rounded-full bg-black/15">Edit</button>
          <button type="button" onclick="del(${index})" class="w-full h-8 me-2 lg:ms-0 px-4 py-1 font-semibold rounded-full bg-red-400">Delete</button>
        </div>
      </div>
    `;
          b.appendChild(div);
        });
      }
      function show() {
        let students = JSON.parse(localStorage.getItem("cls")) || [];
        Data(students);
      }
      function searchData() {
        let search = document.getElementById("search").value.toLowerCase();
        let students = JSON.parse(localStorage.getItem("cls")) || [];

        let filtered = students.filter((student) => {
          return (
            student.name.toLowerCase().includes(search) ||
            student.reg.includes(search) ||
            student.dept.toLowerCase().includes(search)
          );
        });

        Data(filtered);
      }
      function edit(index) {
        let students = JSON.parse(localStorage.getItem("cls")) || [];
        let about = students[index];
        document.getElementById("name").value = about.name;
        document.getElementById("reg").value = about.reg;
        document.getElementById("dept").value = about.dept;
        editItem = index;
      }
      function del(index) {
        if (confirm("Are you sure you want to delete")) {
          let students = JSON.parse(localStorage.getItem("cls")) || [];
          students.splice(index, 1);
          localStorage.setItem("cls", JSON.stringify(students));
          show();
        }
      }
    </script>
  </body>
</html>
